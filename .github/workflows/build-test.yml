name: Build and Test

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  build-test:
    name: Debian Trixie build + unit tests
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build and test dependencies
      run: |
        apt-get update
        apt-get install -y \
          devscripts debhelper dh-python pybuild-plugin-pyproject \
          python3-all python3-all-dev python3-setuptools build-essential git \
          libssl-dev libidn-dev libbsd-dev \
          python3-msgspec python3-pytest python3-websockets python3-cryptography

    # The Zig port's A/B conformance golden is generated from THIS (the normative Python) reference.
    # Regenerate it here — where msgspec is already installed — and fail if it drifts from what's
    # committed, so the Zig engine can never silently diverge from the oracle. Only needs msgspec, so
    # it runs before the slow C-extension builds below (fast feedback). git diff only inspects the one
    # generated file, so the Debian package build's artifacts don't affect it.
    - name: Zig conformance — golden drift check
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        python3 zig/conformance/generate.py
        git diff --exit-code zig/conformance/golden.json

    # SCRAM (RFC 5802) tests need the truenas_pyscram C extension. It is not in Debian, so
    # build it from source here; without it the SCRAM tests in tests/test_auth.py self-skip.
    - name: Build and install truenas_scram (enables the SCRAM tests)
      run: |
        cd /tmp
        git clone --depth 1 https://github.com/truenas/truenas_scram.git
        cd truenas_scram
        dpkg-buildpackage -us -uc -b
        dpkg -i ../libtruenas-scram1_*.deb \
               ../libtruenas-scram-dev_*.deb \
               ../python3-truenas-scram_*.deb

    # The filterable (query) tests need the truenas_pyfilter C engine shipped by
    # truenas_pyos. Like truenas_scram above it is not in Debian, so build it from
    # source; without it the tests in tests/test_filterable.py self-skip.
    - name: Build and install truenas_pyos (enables the filterable tests)
      run: |
        cd /tmp
        git clone --depth 1 https://github.com/truenas/truenas_pyos.git
        cd truenas_pyos
        dpkg-buildpackage -us -uc -b
        dpkg -i ../python3-truenas-pyos_*.deb

    # The package lives under python/ (debian/, pyproject.toml, tests/ are all there). The
    # build's dh_auto_test is disabled (see python/debian/rules), so this only builds the .deb.
    - name: Build the Debian package
      working-directory: python
      run: dpkg-buildpackage -us -uc -b

    - name: Install the built package and smoke-test imports
      run: |
        apt-get install -y ./python3-truenas-pyjsonrpc_*.deb
        cd /tmp
        python3 -c "import truenas_pyjsonrpc, truenas_pyjsonrpc_server, truenas_pyjsonrpc_client; print('import OK')"

    # The full pytest suite runs against the source tree (pyproject sets pythonpath=["."]).
    # test_pam.py self-skips here (no loaded pam_truenas stack) — it runs in qemu-test.yml.
    - name: Run unit tests
      working-directory: python
      run: python3 -m pytest tests/ -q
