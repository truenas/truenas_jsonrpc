name: Rust

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

# A push to a PR branch would otherwise build twice; keep only the latest run.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + lint + test gate. clippy runs with `-D warnings`, so the workspace lint
  # policy (Cargo.toml: `unsafe_code = "forbid"`, `missing_docs = "warn"`) is
  # enforced — a missing doc or any clippy lint fails the build.
  clippy-and-test:
    name: Rust core — build, clippy, A/B conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ubuntu-latest ships rustup + a current stable toolchain; just add clippy.
      - name: Ensure clippy
        run: rustup component add clippy

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # Runs the unit/integration tests, including tests/conformance.rs — the differential
      # check that replays the committed frozen golden corpus
      # (truenas-rpc/tests/conformance/golden.json) through the Rust dispatch core and
      # asserts byte-stable responses + audit records. No external dependency.
      - name: Test
        run: cargo test --all-features --locked

  # Coverage gate: native source-based coverage (`rustc -C instrument-coverage` + the
  # toolchain's bundled `llvm-profdata`/`llvm-cov`), driven by rust/coverage.sh, with a
  # hard 100%-of-lines floor. No third-party tools. Runs on stable: rather than
  # *excluding* defensive code, the tests exercise it directly (e.g. `#[should_panic]`
  # over the "can't happen" arms), so the floor is a real 100%.
  coverage:
    name: Rust core — 100% line coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner's stable toolchain only lacks the LLVM coverage tools; add them.
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Coverage (100% line floor)
        run: bash coverage.sh 100

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: target/coverage/cov.lcov
