# `truenas-jsonrpc-server` — the optional async server transport for `truenas-jsonrpc`.
# Length-prefixed JSON framing + `$/negotiate`
# over AF_UNIX and plain TCP; TLS/kTLS and WebSocket arrive behind opt-in features. It is NOT
# in the workspace `default-members` (a plain `cargo build`/`coverage.sh` skips it, like the
# pyo3 bridge) — the dispatch core stays transport-free; depend on this crate to run a server.
[package]
name = "truenas-jsonrpc-server"
version = "0.1.0"
description = "Optional async server transport (AF_UNIX/TCP, length-prefixed JSON, $/negotiate) for truenas-jsonrpc"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
truenas-jsonrpc = { path = "../truenas-jsonrpc" }
# The XDR codec — the second `ProtocolEngine` (ONC RPC, `oncrpc.rs`) encodes/decodes its binary
# wire directly. Already in the lock (transitive via truenas-jsonrpc's XDR dispatch), so no new crate.
truenas-xdr = { path = "../truenas-xdr" }
serde = { workspace = true }
serde_json = { workspace = true }
# `net` pulls mio + socket2 (the only new transitive crates for AF_UNIX/TCP — tokio's own
# networking foundation); `io-util` gives the framed read/write helpers.
tokio = { workspace = true, features = ["net", "io-util", "sync", "rt", "macros", "time"] }
# Unix peer credentials (SO_PEERCRED); also the syscall surface for kTLS / SCM_RIGHTS / splice
# in later phases. Already in the lock (transitive via tokio/mio on unix), so no new crate.
libc = "0.2"
# Cancel-safe framed reads: an accumulation buffer fed by tokio's `read_buf` (so a frame is
# never lost when the read loop's select! picks another branch). Already in the lock via tokio.
bytes = "1"
# SCM_RIGHTS fd passing: nix's safe sendmsg/recvmsg + ControlMessage::ScmRights, instead of
# hand-rolling the cmsg buffer math. Its 4 deps (libc/bitflags/cfg-if/memoffset) are already
# in the lock, so this adds exactly one crate.
nix = { version = "0.29", features = ["socket", "uio"] }
# TLS transport (opt-in `tls` feature), linking the *system* OpenSSL (no vendored C build).
# Two configurable modes (see `TlsMode`): kernel TLS — handshake via a socket BIO (openssl-sys
# FFI), then the raw kernel-encrypted fd, so the bulk transfer never enters userspace; and a
# userspace pump via tokio-openssl (works anywhere, but no raw-fd transfer).
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true } # socket-BIO FFI for the kTLS handshake
tokio-openssl = { version = "0.6", optional = true } # the userspace-TLS SslStream pump
foreign-types = { version = "0.3", optional = true } # ForeignType::as_ptr for the raw SSL*
# Header types (`http::HeaderMap`) for the forwarded-origin extractor — read on the WebSocket
# upgrade request. Gated on `websocket` (its only use), so a non-WS build pulls no http.
http = { version = "1", optional = true }
# WebSocket transport: JSON-RPC framed as WebSocket messages (the library owns the framing, so
# no raw-fd transfer).
tokio-tungstenite = { version = "0.24", optional = true }
# `FuturesUnordered` drives a connection's in-flight dispatches on its own task (no per-request
# spawn); also Stream/Sink + `.split()` for the WS stream (the `websocket` feature).
futures-util = "0.3"

[features]
# Encrypted TCP via system OpenSSL (kernel TLS or a userspace pump, per TlsMode). Off by
# default: the default build pulls no openssl crates.
tls = ["dep:openssl", "dep:openssl-sys", "dep:tokio-openssl", "dep:foreign-types"]
# WebSocket transport (ws://). Off by default — pulls tokio-tungstenite + http (the upgrade-header
# parser for the forwarded-origin extractor) and nothing else; a non-WS build carries none of it.
websocket = ["dep:tokio-tungstenite", "dep:http"]
# SCM_RIGHTS control-frame primitives (`scm`) for handing a connection fd to a local auth broker.
# No new dependencies (nix is already in); off by default — the auth crate's `passthrough` enables it.
passthrough = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

# This crate makes syscalls (SO_PEERCRED now; kTLS / SCM_RIGHTS in later phases), so it cannot
# use the workspace's `unsafe_code = "forbid"`. It denies unsafe by default and allows it only
# in narrowly-scoped, audited blocks (`#[allow(unsafe_code)]`); the dispatch core stays forbid.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
