# `truenas-keyring` — a config-driven Linux kernel-keyring store for TrueNAS credentials.
#
# A root keyring (persistent / session / user …, selected by config) holding named sub-keyrings —
# the built-in `server_keys` (inbound SCRAM verifiers) and `client_keys` (outbound peer
# credentials), plus any extras the config declares. Records are stored as plaintext JSON `user`
# keys; the kernel keyring's UID/permission boundary is the protection (no at-rest encryption — the
# privileged-container memory-scrape threat is out of scope). Not in `default-members` (it makes
# keyring syscalls and needs a Linux keyring to test against).
[package]
name = "truenas-keyring"
version = "0.1.0"
description = "Config-driven Linux kernel-keyring store for TrueNAS SCRAM verifiers / peer credentials"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The kernel keyring syscalls (add_key(2) / keyctl(2)) are issued directly via libc::syscall —
# we own the ~7-call surface rather than depend on a niche third-party keyutils crate.
libc = "0.2"

# Like the server crate, this crate makes syscalls, so it can't use the workspace's
# `unsafe_code = "forbid"`. It denies unsafe and allows it only in narrowly-scoped, audited
# blocks (`#[allow(unsafe_code)]` + `// SAFETY:`), all confined to `sys.rs`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
