# Cargo workspace for the Rust portion of truenas_jsonrpc.
#
# Full parity (core + filter + transport + server + client) is the end goal; this
# workspace starts with the transport-agnostic dispatch core (`truenas-jsonrpc`,
# the Rust equivalent of Python's `truenas_pyjsonrpc.JSONRPCProtocol`). The other
# crates are added as later phases (see the plan).
[workspace]
resolver = "2"
members = ["truenas-jsonrpc", "truenas-filter"]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["iXsystems, Inc., dba TrueNAS <dev@truenas.com>"]
repository = "https://github.com/truenas/truenas_jsonrpc"
rust-version = "1.75"

# Lint policy shared by every crate in the workspace (each opts in with
# `lints.workspace = true`). This is a protocol core: forbid `unsafe` outright and
# require the public API to stay documented.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
async-trait = "0.1"
# truenas-jsonrpc depends on the filter engine for filterable (query) methods.
truenas-filter = { path = "truenas-filter" }
