# Cargo workspace for the Rust portion of truenas_jsonrpc.
#
# Full parity (core + filter + transport + server + client) is the end goal; this
# workspace starts with the transport-agnostic dispatch core (`truenas-jsonrpc`,
# the Rust equivalent of Python's `truenas_pyjsonrpc.JSONRPCProtocol`). The other
# crates are added as later phases (see the plan).
[workspace]
resolver = "2"
members = [
    "truenas-jsonrpc",
    "truenas-filter",
    "truenas-xdr",
    "truenas-xdr-derive",
    "truenas-jsonrpc-codegen",
    "truenas-jsonrpc-pyo3",
    "truenas-jsonrpc-server",
    "truenas-jsonrpc-auth",
    "truenas-keyring",
    "truenas-nss",
    "examples/demo",
]
# Five crates are excluded from the default set (a plain `cargo build`/`cargo test` and
# `coverage.sh`, which run without `-p`, skip them): `truenas-jsonrpc-pyo3` links libpython
# (so the default build links none, mirroring Zig's `-Dpython` opt-in); `truenas-jsonrpc-server`
# does socket / kTLS / SCM_RIGHTS I/O that can't be unit-tested to 100% deterministically; the
# opt-in auth layers above the core — `truenas-jsonrpc-auth` (peer-cred / mTLS / SCRAM, the latter
# behind feature flags + OpenSSL) and `truenas-keyring` (raw kernel-keyring syscalls, whose tests
# skip when no keyring is available); and `truenas-nss` (passwd FFI, whose tests need a passwd db).
# All are covered behaviorally and excluded from the coverage gate, but still built by
# `cargo clippy --workspace` and tested with `cargo test -p …`.
default-members = [
    "truenas-jsonrpc",
    "truenas-filter",
    "truenas-xdr",
    "truenas-xdr-derive",
    "truenas-jsonrpc-codegen",
    "examples/demo",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["iXsystems, Inc., dba TrueNAS <dev@truenas.com>"]
repository = "https://github.com/truenas/truenas_jsonrpc"
rust-version = "1.75"

# Lint policy shared by every crate in the workspace (each opts in with
# `lints.workspace = true`). This is a protocol core: forbid `unsafe` outright and
# require the public API to stay documented.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
async-trait = "0.1"
# truenas-jsonrpc depends on the filter engine for filterable (query) methods.
truenas-filter = { path = "truenas-filter" }
# ...and on the XDR codec for the binary wire (the `xdr:true` methods + the TXDR frame).
truenas-xdr = { path = "truenas-xdr" }
