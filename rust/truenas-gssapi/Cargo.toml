# `truenas-gssapi` — a minimal hand-written FFI to the system GSSAPI (MIT krb5) acceptor.
#
# The auth crate's native Kerberos mechanism uses ~6 functions of the frozen RFC 2744 C ABI. We bind
# them directly rather than depend on `libgssapi`, which pulls `libgssapi-sys` → `bindgen` → `clang-sys`
# and requires `libclang` on every build host. This mirrors how `truenas-keyring` (keyctl),
# `truenas-nss` (getpwnam), and `truenas-audit` (netlink) own their small FFI surfaces. Not in
# `default-members` (it links system krb5 and its accept path needs a KDC/keytab to exercise fully).
[package]
name = "truenas-gssapi"
version = "0.1.0"
description = "Minimal FFI to the system GSSAPI (MIT krb5) acceptor for truenas-jsonrpc-auth"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# Reserve the native lib so only one crate in the graph links it.
links = "gssapi_krb5"

[build-dependencies]
# Locates the system MIT krb5 GSSAPI and emits the link directives (already in the lock via
# `openssl-sys`). A `krb5-config` fallback covers hosts without the `.pc` file.
pkg-config = "0.3"

# Like keyring/nss/audit, this crate makes FFI calls, so it can't use the workspace's
# `unsafe_code = "forbid"`. It denies unsafe and allows it only in narrowly-scoped, audited blocks
# (`#[allow(unsafe_code)]` + `// SAFETY:`), all confined to `sys.rs` (+ the one `Send` impl).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
