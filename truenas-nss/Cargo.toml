# `truenas-nss` — name-service (NSS) lookups for the auth layer.
#
# Today it does exactly what authorization needs: the **passwd** database ([`passwd`] module —
# `getpwnam_r` / `getpwuid_r`) to resolve a SCRAM username → uid (and a uid back to an account) so
# roles can be keyed off the uid. It's named for the broader surface on purpose: the group database
# (`getgrnam` / `getgrouplist`) and other NSS bits can be added as sibling modules when we need
# them, without a new crate. Like the keyring/server crates it issues syscalls, so it's excluded
# from `default-members` (its tests need a live passwd db).
[package]
name = "truenas-nss"
version = "0.1.0"
description = "Name-service (NSS) lookups for TrueNAS auth — passwd username↔uid resolution, room to grow"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The reentrant passwd lookups (getpwnam_r / getpwuid_r) and `struct passwd`; no other deps.
libc = "0.2"

# Like the keyring/server crates it does FFI, so it can't use the workspace's
# `unsafe_code = "forbid"`. It denies unsafe and allows it only in narrow, audited blocks
# (`#[allow(unsafe_code)]` + `// SAFETY:`).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
