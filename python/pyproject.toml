[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas_pyjsonrpc"
description = "Pure-Python (msgspec) JSON-RPC 2.0 dispatch core, asyncio server, and thread-safe client for TrueNAS"
requires-python = ">=3.11"
license = {text = "MIT"}
version = "0.1.0"
dependencies = ["msgspec"]

[project.optional-dependencies]
# WebSocket transport (truenas_pyjsonrpc_server.WebSocketConfig /
# truenas_pyjsonrpc_client.WebSocketConfig). Not needed for AF_UNIX or plain/TLS TCP.
websocket = ["websockets>=13"]
# FilterableJSONRPCMethod delegates query-filters/query-options to the truenas_pyfilter
# C engine; imported lazily, so only needed when a protocol registers filterable methods.
filterable = ["truenas_pyfilter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["truenas_pyjsonrpc*"]

[tool.setuptools.package-data]
"truenas_pyjsonrpc" = ["py.typed", "ARCHITECTURE.md"]
"truenas_pyjsonrpc.mixins.auth" = ["README.md"]
"truenas_pyjsonrpc.mixins.audit" = ["README.md"]
"truenas_pyjsonrpc_server" = ["py.typed", "README.md"]
"truenas_pyjsonrpc_client" = ["py.typed", "README.md"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
# Put this directory (python/) on sys.path so the build-time `codegen.py` tool is
# importable by tests under any pytest invocation.
pythonpath = ["."]
