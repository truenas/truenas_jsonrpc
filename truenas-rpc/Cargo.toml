[package]
name = "truenas-rpc"
version = "0.1.0"
description = "Transport-agnostic JSON-RPC 2.0 dispatch core for TrueNAS"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
# Only `rt` is needed: dispatch is async and offloads sync handlers via spawn_blocking.
tokio = { workspace = true }
# Needed only for the AsyncHandler (AsyncJsonRpcMethod) path; the sync Handler needs none.
async-trait.workspace = true
# The query-filters / query-options engine, for filterable (query) methods.
truenas-filter.workspace = true
# The XDR codec + TXDR frame, for the binary wire (`xdr:true` methods).
truenas-xdr.workspace = true
# OpenSSL's DRBG (FIPS-validated when the FIPS provider is active) is the single entropy source for
# generated identifiers (session / subscription ids) — deliberately not a non-FIPS RNG (getrandom).
openssl = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[features]
default = []

[lints]
workspace = true
